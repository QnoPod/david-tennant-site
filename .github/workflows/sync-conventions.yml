name: Sync convention cancellations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-convention-cancellations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch and save cancelled appearances
        run: npm run sync:conventions
        env:
          CONVENTION_SNAPSHOT_URL: https://david-tennant-site.vercel.app/api/conventions/snapshot
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Commit only when cancellation history changed
        shell: bash
        run: |
          if git diff --quiet -- app/data/autoConventionHistory.json; then
            echo "No convention cancellation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/autoConventionHistory.json
          git commit -m "Auto-update convention cancellation history"
          git pull --rebase origin main
          git push origin HEAD:main
