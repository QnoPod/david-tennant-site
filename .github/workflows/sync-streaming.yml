name: Sync streaming availability

on:
  schedule:
    # 毎日09:20(JST)に、日本の定額配信の終了・再追加を同期します。
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-streaming-availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync Japanese streaming availability
        env:
          STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}
        run: npm run sync:streaming

      - name: Commit only when streaming state changed
        shell: bash
        run: |
          if git diff --quiet -- app/data/generated/streamingAvailability.json; then
            echo "No streaming availability changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/generated/streamingAvailability.json
          git commit -m "Update Japanese streaming availability"
          git pull --rebase origin main
          git push origin HEAD:main
